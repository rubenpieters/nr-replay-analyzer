<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NR Replay Analyzer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 32px; }
    h1 { margin-bottom: 16px; }
    .upload-area { background: white; border: 2px dashed #90caf9; border-radius: 8px; padding: 32px; text-align: center; max-width: 480px; }
    input[type=file] { margin-top: 12px; }
    #output { margin-top: 24px; }
    iframe { width: 100%; height: 90vh; border: 1px solid #e0e0e0; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Netrunner Replay Analyzer</h1>
  <div class="upload-area">
    <p>Upload a raw Netrunner replay <code>.json</code> file to analyze it.</p>
    <input type="file" id="fileInput" accept=".json">
  </div>
  <div id="output"></div>
  <script src="dist/web.js"></script>
</body>
</html>
