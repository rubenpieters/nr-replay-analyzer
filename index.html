<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NR Replay Analyzer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 32px; }
    .header { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
    h1 { margin: 0; white-space: nowrap; }
    .upload-area { background: white; border: 2px dashed #90caf9; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .upload-area p { margin: 0; font-size: 0.9em; color: #555; }
    input[type=file] { font-size: 0.9em; }
    #output { margin-top: 8px; }
    iframe { width: 100%; height: 90vh; border: 1px solid #e0e0e0; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Netrunner Replay Analyzer</h1>
    <div class="upload-area">
      <p>Upload a replay <code>.json</code> file:</p>
      <input type="file" id="fileInput" accept=".json">
    </div>
  </div>
  <div id="output"></div>
  <script src="dist/web.js"></script>
</body>
</html>
